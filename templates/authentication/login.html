{% extends "base_mobile.html" %}

{% block content %}
<div class="mobile-upload-card" style="max-width: 420px; text-align: left;">
  <div style="text-align: center; margin-bottom: 24px;">
    <div style="width: 48px; height: 48px; background: linear-gradient(135deg, #0284C7, #0D9488); border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; font-weight: 800; color: #fff; font-size: 20px;">SM</div>
    <h2 style="color: var(--primary-navy); margin-top: 12px; font-size: 22px;">SmartMed AI Portal</h2>
    <p style="color: var(--text-muted); font-size: 13px;">Authorized Medical Research Authentication</p>
  </div>

  {% if messages %}
  {% for message in messages %}
  <div class="alert alert-{{ message.tags }}" style="margin-bottom: 16px; font-size: 13px;">
    <span>{{ message }}</span>
  </div>
  {% endfor %}
  {% endif %}

  <form method="POST" action="{% url 'auth:login' %}">
    {% csrf_token %}
    <div class="form-group">
      <label class="form-label" for="username">Username</label>
      <input type="text" id="username" name="username" class="form-control" placeholder="Enter research username" required autofocus>
    </div>

    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <input type="password" id="password" name="password" class="form-control" placeholder="Enter password" required>
    </div>

    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px; padding: 11px;">
      Sign In to Platform
    </button>
  </form>

  <div style="margin-top: 20px; text-align: center; font-size: 12.5px; color: var(--text-muted); border-top: 1px solid var(--border-subtle); padding-top: 16px;">
    Need authorized researcher access?
    <a href="{% url 'auth:register' %}" style="color: var(--accent-teal); font-weight: 600; text-decoration: none;">Register account</a>
  </div>
</div>
{% endblock %}
