{% extends "base_mobile.html" %}

{% block content %}
<div class="mobile-upload-card" style="max-width: 440px; text-align: left;">
  <div style="text-align: center; margin-bottom: 20px;">
    <div style="width: 44px; height: 44px; background: linear-gradient(135deg, #0284C7, #0D9488); border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; font-weight: 800; color: #fff; font-size: 18px;">SM</div>
    <h2 style="color: var(--primary-navy); margin-top: 10px; font-size: 20px;">Register Researcher Account</h2>
    <p style="color: var(--text-muted); font-size: 12.5px;">SmartMed AI Research Platform</p>
  </div>

  {% if messages %}
  {% for message in messages %}
  <div class="alert alert-{{ message.tags }}" style="margin-bottom: 16px; font-size: 13px;">
    <span>{{ message }}</span>
  </div>
  {% endfor %}
  {% endif %}

  <form method="POST" action="{% url 'auth:register' %}">
    {% csrf_token %}
    <div class="form-group">
      <label class="form-label" for="full_name">Full Name</label>
      <input type="text" id="full_name" name="full_name" class="form-control" placeholder="Dr. Jane Doe" required>
    </div>

    <div class="form-group">
      <label class="form-label" for="username">Username</label>
      <input type="text" id="username" name="username" class="form-control" placeholder="jdoe" required>
    </div>

    <div class="form-group">
      <label class="form-label" for="email">Institutional Email</label>
      <input type="email" id="email" name="email" class="form-control" placeholder="jdoe@hospital.org" required>
    </div>

    <div class="form-group">
      <label class="form-label" for="role">Requested Role</label>
      <select id="role" name="role" class="form-select">
        <option value="reviewer" selected>Researcher / Authorized Reviewer</option>
        <option value="admin">System Administrator</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <input type="password" id="password" name="password" class="form-control" placeholder="Min 6 characters" required>
    </div>

    <div class="form-group">
      <label class="form-label" for="confirm_password">Confirm Password</label>
      <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Re-enter password" required>
    </div>

    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px; padding: 11px;">
      Create Account
    </button>
  </form>

  <div style="margin-top: 18px; text-align: center; font-size: 12.5px; color: var(--text-muted); border-top: 1px solid var(--border-subtle); padding-top: 14px;">
    Already have an authorized account?
    <a href="{% url 'auth:login' %}" style="color: var(--accent-teal); font-weight: 600; text-decoration: none;">Sign In</a>
  </div>
</div>
{% endblock %}
